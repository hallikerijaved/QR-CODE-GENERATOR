<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Code Generator (QR & Bar)</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Load qrcode.js library for QR code generation -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <!-- Load JsBarcode library for Barcode generation -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        /* Custom styles for the font and background */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc; /* Light background */
            display: flex;
            flex-direction: column; /* Allow content and footer to stack */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Styling the common code output area */
        .code-output {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 24px;
            padding: 16px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            min-height: 256px;
        }

        /* Ensure the canvas/image inside qrcode div is centered */
        #qrcode > canvas, #qrcode > img {
            max-width: 100%;
            height: auto;
        }

        /* Styling for the Barcode SVG container */
        #barcode svg {
            width: 90%;
            height: 180px; /* fixed height for better barcode display */
        }
    </style>
</head>
<body>

    <div class="w-full max-w-lg bg-white p-8 md:p-10 rounded-xl shadow-2xl border border-gray-100">
        <!-- Header -->
        <h1 class="text-3xl font-extrabold text-gray-900 mb-2 text-center">
            Universal Code Generator
        </h1>
        <p class="text-gray-500 mb-6 text-center">
            Select a code type and enter any URL or text.
        </p>

        <!-- Code Type Selection -->
        <div class="flex justify-center space-x-6 mb-6">
            <label class="inline-flex items-center cursor-pointer">
                <input type="radio" name="codeType" value="qr" checked onchange="generateCode()"
                       class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500">
                <span class="ml-2 text-gray-700 font-semibold">QR Code</span>
            </label>
            <label class="inline-flex items-center cursor-pointer">
                <input type="radio" name="codeType" value="barcode" onchange="generateCode()"
                       class="form-radio h-4 w-4 text-blue-600 focus:ring-blue-500">
                <span class="ml-2 text-gray-700 font-semibold">Bar Code</span>
            </label>
        </div>

        <!-- Input Section -->
        <div class="space-y-4">
            <input
                id="qr-input"
                type="text"
                placeholder="e.g., https://www.google.com or 1234567890"
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 shadow-sm transition duration-150 ease-in-out"
                value="https://bio-self-seven.vercel.app/"
            >

            <button
                id="generate-button"
                onclick="generateCode()"
                class="w-full bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition duration-300 ease-in-out shadow-md hover:shadow-lg"
            >
                Generate Code
            </button>
        </div>

        <!-- Message Box -->
        <div id="message-box" class="mt-4 text-center text-red-600 font-medium hidden p-3 bg-red-50 rounded-lg border border-red-200">
            <!-- Error messages go here -->
        </div>

        <!-- Code Output Area -->
        <div id="code-output-container" class="mt-8">
            <!-- QR Code Output -->
            <div id="qrcode" class="code-output">
                <p class="text-gray-400">Your QR code will appear here.</p>
            </div>
            
            <!-- Bar Code Output (Initially Hidden) -->
            <div id="barcode" class="code-output hidden">
                <!-- SVG will be injected here by JsBarcode -->
                <svg id="barcode-svg-output"></svg>
            </div>
            
            <!-- Download Button (Common for both types) -->
            <button
                id="download-button"
                onclick="downloadCode()"
                class="mt-4 w-full bg-green-500 text-white font-semibold py-3 rounded-lg hover:bg-green-600 transition duration-300 ease-in-out shadow-md hidden"
            >
                Download Code
            </button>
        </div>

    </div>
    
    <!-- Developer Credit Footer -->
    <footer class="text-center mt-6 text-gray-500 text-sm w-full max-w-lg">
        Developed by Javed Hallikeri
    </footer>

    <script>
        // Global variable to hold the QR code instance
        let qrCodeInstance = null;

        // Utility to get the currently selected code type
        function getSelectedCodeType() {
            return document.querySelector('input[name="codeType"]:checked').value;
        }

        // Utility to show messages (errors or success)
        function showMessage(text, isError = true) {
            const msgBox = document.getElementById('message-box');
            msgBox.textContent = text;
            msgBox.className = 'mt-4 text-center font-medium p-3 rounded-lg border';
            
            if (isError) {
                msgBox.classList.add('text-red-600', 'bg-red-50', 'border-red-200');
            } else {
                msgBox.classList.add('text-green-600', 'bg-green-50', 'border-green-200');
            }

            msgBox.classList.remove('hidden');
        }

        // Utility to hide messages
        function hideMessage() {
            document.getElementById('message-box').classList.add('hidden');
        }

        // Function to generate the code (QR or Barcode)
        function generateCode() {
            const inputElement = document.getElementById('qr-input');
            const data = inputElement.value.trim();
            const qrCodeDiv = document.getElementById('qrcode');
            const barcodeDiv = document.getElementById('barcode');
            const downloadButton = document.getElementById('download-button');
            const codeType = getSelectedCodeType();
            
            hideMessage();

            // Clear previous outputs
            qrCodeDiv.innerHTML = '<p class="text-gray-400">Your QR code will appear here.</p>';
            document.getElementById('barcode-svg-output').innerHTML = ''; // Clear SVG
            
            if (!data) {
                showMessage("Please enter some text or a link to generate the code.", true);
                downloadButton.classList.add('hidden');
                return;
            }

            downloadButton.classList.remove('hidden');
            document.getElementById('download-button').textContent = `Download ${codeType === 'qr' ? 'QR Code (PNG)' : 'Bar Code (SVG)'}`;
            document.getElementById('generate-button').textContent = `Generate ${codeType === 'qr' ? 'QR Code' : 'Bar Code'}`;

            if (codeType === 'qr') {
                barcodeDiv.classList.add('hidden');
                qrCodeDiv.classList.remove('hidden');
                
                try {
                    qrCodeDiv.innerHTML = '';
                    const size = 256; 
                    
                    // Instantiate a new QR code
                    qrCodeInstance = new QRCode(qrCodeDiv, {
                        text: data,
                        width: size,
                        height: size,
                        colorDark : "#000000",
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                } catch (error) {
                    console.error("QR Code Generation Error:", error);
                    showMessage("An error occurred during QR code generation. Please try again.", true);
                    downloadButton.classList.add('hidden');
                }
            } else { // Barcode
                qrCodeDiv.classList.add('hidden');
                barcodeDiv.classList.remove('hidden');
                
                try {
                    // JsBarcode writes directly to the SVG element
                    JsBarcode("#barcode-svg-output", data, {
                        format: "CODE128", // Common format
                        displayValue: true,
                        margin: 10,
                        width: 2,
                        height: 100,
                        text: data.length > 30 ? data.substring(0, 30) + '...' : data // Truncate long text
                    });
                } catch (error) {
                    console.error("Barcode Generation Error:", error);
                    showMessage("Error generating Bar Code. Barcodes usually require alphanumeric input.", true);
                    downloadButton.classList.add('hidden');
                    barcodeDiv.innerHTML = '<p class="text-gray-400">Barcode input error.</p>';
                }
            }
        }
        
        // Function to download the generated code
        function downloadCode() {
            const codeType = getSelectedCodeType();
            const inputData = document.getElementById('qr-input').value.trim();
            
            // Sanitize the input for a safe filename
            const safeFileName = inputData.substring(0, 30).replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'code';
            const dateStr = new Date().toISOString().slice(0, 10);
            let filename = `${safeFileName}_${dateStr}`;
            let dataURL = null;
            let mimeType = '';

            if (codeType === 'qr') {
                // QR Code (Canvas -> PNG)
                const canvas = document.getElementById('qrcode').querySelector('canvas');
                if (canvas) {
                    dataURL = canvas.toDataURL("image/png");
                    filename += '.png';
                    mimeType = 'image/png';
                }
            } else {
                // Bar Code (SVG -> SVG file)
                const barcodeSvg = document.getElementById('barcode-svg-output');
                if (barcodeSvg && barcodeSvg.hasChildNodes()) {
                    const serializer = new XMLSerializer();
                    let svgString = serializer.serializeToString(barcodeSvg);
                    // Add standard SVG/XML headers
                    svgString = '<?xml version="1.0" standalone="no"?>\r\n' + svgString;
                    
                    const blob = new Blob([svgString], { type: "image/svg+xml;charset=utf-8" });
                    dataURL = URL.createObjectURL(blob);
                    filename += '.svg';
                    mimeType = 'image/svg+xml';
                }
            }

            if (dataURL) {
                // Create a temporary link element and trigger download
                const link = document.createElement('a');
                link.href = dataURL;
                link.download = filename;
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                // Clean up the object URL created for the Barcode Blob
                if (codeType === 'barcode') {
                    URL.revokeObjectURL(dataURL); 
                }

                showMessage(`Download started: ${filename}`, false);
                setTimeout(hideMessage, 3000); 
            } else {
                showMessage(`Could not find the generated ${codeType} to download. Please generate it first.`, true);
            }
        }

        // Automatically generate the initial QR code when the page loads
        window.onload = function() {
            generateCode();
        };

    </script>
</body>
</html>
